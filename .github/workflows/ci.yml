name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install streamlit pandas numpy plotly opencv-python-headless psutil pytest

      - name: Static smoke check
        run: python scripts/smoke_check.py

      - name: Server smoke check
        run: python scripts/smoke_check.py --server

      - name: Test suite
        run: python -m pytest -q
